<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#122a43" />
    <meta
      name="description"
      content="A student admissions and attendance dashboard with a tamper-evident blockchain ledger prototype."
    />
    <title>Attendly — Student attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="Attendly home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.5 12 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>attendly<span class="brand-period">.</span></span>
        </a>

        <div class="workspace-label">WORKSPACE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-link active" href="#overview" data-view="overview">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>
            <span>Overview</span>
          </a>
          <a class="nav-link" href="#students" data-view="students">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H7.4A3.4 3.4 0 0 0 4 18.4V20"/><circle cx="10" cy="7.5" r="3.5"/><path d="M20 20v-1.6a3.4 3.4 0 0 0-2.5-3.3M16.5 4.2a3.5 3.5 0 0 1 0 6.7"/></svg></span>
            <span>Students</span>
            <span class="nav-count" id="student-nav-count">0</span>
          </a>
          <a class="nav-link" href="#admissions" data-view="admissions">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></span>
            <span>Admissions</span>
          </a>
          <a class="nav-link" href="#attendance" data-view="attendance">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 9.5h17M8 14l2.2 2.2L16 11.5"/></svg></span>
            <span>Attendance</span>
          </a>
          <a class="nav-link" href="#ledger" data-view="ledger">
            <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12.1V21"/></svg></span>
            <span>Blockchain ledger</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="chain-card">
            <span class="chain-card-icon"><svg viewBox="0 0 24 24"><path d="M7.5 12a4.5 4.5 0 0 1 4.5-4.5h3a4.5 4.5 0 0 1 0 9h-3"/><path d="M16.5 12A4.5 4.5 0 0 1 12 16.5H9a4.5 4.5 0 0 1 0-9h3"/></svg></span>
            <strong>Records, linked.</strong>
            <span>Every update adds a verifiable link to the ledger.</span>
            <a href="#ledger" data-view="ledger">Explore the ledger <span aria-hidden="true">→</span></a>
          </div>
          <div class="profile">
            <div class="avatar avatar-admin">AD</div>
            <div class="profile-copy"><strong>School admin</strong><span>Administrator</span></div>
            <button class="icon-button profile-menu" type="button" aria-label="Administrator menu">
              <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="icon-button mobile-menu" type="button" id="menu-toggle" aria-label="Open navigation">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="breadcrumb"><span>School workspace</span><span class="breadcrumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-right">
            <span class="today-label" id="today-label"></span>
            <span class="topbar-divider"></span>
            <span class="secure-label"><span class="secure-dot"></span> Secure records</span>
          </div>
        </header>
        <div class="page-content" id="page-content" tabindex="-1"></div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="app.js"></script>
  </body>
</html>
